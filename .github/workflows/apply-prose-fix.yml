name: Apply prose consistency fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_prose.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add prose consistency workflow' || github.event.head_commit.message == 'Add prose consistency fixer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_prose.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1/index.html 2/index.html 3/index.html 4/index.html 5/index.html 6/index.html 7/index.html 8/index.html 9/index.html list/index.html
          git diff --cached --check
          git commit -m "Fix prose contradictions and inconsistencies"
          git push
