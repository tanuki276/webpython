name: Apply text consistency fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-text-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function fixFile(path, replacements, message) {
              const r = await github.rest.repos.getContent({ owner, repo, path });
              let text = Buffer.from(r.data.content, 'base64').toString('utf8');
              const before = text;
              for (const [from, to] of replacements) text = text.split(from).join(to);
              if (text === before) return;
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path,
                message,
                content: Buffer.from(text).toString('base64'),
                sha: r.data.sha
              });
            }

            await fixFile('1/index.html', [
              ['<tr><th>名誉街国王</th><td>', '<tr><th>街国王（名誉称号）</th><td>'],
              ['ナポレオンによる<a href="/main.html?query=ライン同盟">ライン同盟</a>の解体と、それに伴うヨーロッパの勢力均衡の再構築の時期を捉え', 'ナポレオン戦争下で<a href="/main.html?query=ライン同盟">ライン同盟</a>体制が揺らぎ、南ドイツの勢力関係が流動化した時期を捉え'],
              ['この戦災により、在位していた街国王一家が死亡し、ヴァイゼンベルク家による象徴的地位は一時的に途絶する形となった。', 'この戦災により、在位していた街国王と近親者の多くが死亡し、継承者の所在も直後には確認できなかったため、街国王位は一時的に空位となった。'],
              ['戦災を免れた最後の直系の子孫であるユリアス・ヴァイゼンベルク', '戦災を免れ、のちに正統な継承者と確認された直系子孫であるユリアス・ヴァイゼンベルク']
            ], 'Fix Nova Hazelburg chronology and succession wording');

            await fixFile('2/index.html', [
              ['科学的な根拠を一切有していないため、歴史学、人類学、言語学の主流な学会からは', '科学的根拠は確認されておらず、歴史学、人類学、言語学の主流の学界からは'],
              ['技術的な経路は依然として憶測の域を出ません', '技術的な経路は依然として憶測の域を出ていない'],
              ['一部の中国、特にキルギス人のルーツに関心を持つ研究者や一般市民の間では', '中国やキルギスを中心に、両民族のルーツに関心を持つ一部の民間研究者や一般市民の間では']
            ], 'Polish Koretsu-Kanzoku prose');

            await fixFile('3/index.html', [
              ['halezia independent republic （英語）', 'Halezia Independent Republic（英語）'],
              ['<tr><th>gdp（ppp）合計</th>', '<tr><th>GDP（PPP）合計</th>'],
              ['<tr><th>gdp（ppp）1人あたり</th>', '<tr><th>GDP（PPP）1人あたり</th>'],
              ['ハレジア・フラン（haf）', 'ハレジア・フラン（HAF）'],
              ['保平 (10年連続在任中)', '保平（2015年就任、2025年時点）'],
              ['南シナ海またはナトゥナ海域に位置する', '南シナ海南部、ナトゥナ海域に位置する'],
              ['1250年からの<a href="/main.html?query=シュリーヴィジャヤ王国">シュリーヴィジャヤ王国</a>などによる約700年にわたる外国支配を経て、1945年に独立を達成した。', '1250年の<a href="/main.html?query=シュリーヴィジャヤ王国">シュリーヴィジャヤ王国</a>による支配を皮切りに断続的な外国支配を経験し、1676年以降は欧州列強などの植民地支配を受けたのち、1945年に独立を達成した。'],
              ['（bc6000頃〜ad1250）', '（紀元前6000年頃〜1250年）'],
              ['統治権の衰退に伴い、稜、秉、原、亳阜、後春の五大国家が独立し', '1312年頃、統治権の衰退に伴い、稜、秉、原、亳阜、後春の五大国家が独立し'],
              ['平和協定「五国寧道の書」により150年ほど平和が続いたが', '平和協定「五国寧道の書」により約110年間、比較的平和な時期が続いたが'],
              ['親日派が非常に多く、<a href="#経済">日本語が経済面の主要言語</a>として広く機能している点が、周辺国と比較して特異である', '日本との経済・人的交流が盛んで、<a href="#経済">日本語が経済面の主要言語</a>として広く機能している点が、周辺国と比較した特徴となっている']
            ], 'Fix Halezia chronology and terminology');

            await fixFile('4/index.html', [
              ['東大寺大仏開眼会前後に献上されたとされる宮中第一の唐猫', '東大寺大仏開眼会前後に渡来したと伝えられる唐猫'],
              ['<a href="/main.html?query=聖武天皇">聖武天皇</a>に厚く愛玩されたことで知られる', '<a href="/main.html?query=聖武天皇">聖武天皇</a>に厚く愛玩されたという後世の伝承で知られる'],
              ['𣑥は、天平勝宝四年（752年）に催された<a href="/main.html?query=東大寺">東大寺</a>大仏開眼会に際して、唐からの使節団を通じて献上されたものと推測されている<sup>[3]</sup>。当時の日本では、仏教の興隆に伴い、東大寺をはじめとする大寺院に大量の経典が保管されていたが、ネズミによる食害が深刻な問題となっていた。𣑥は、単なる献上品というだけでなく、国家事業たる経典の保護という重要な使命を帯びて唐土より招かれた。', '𣑥は、天平勝宝四年（752年）に催された<a href="/main.html?query=東大寺">東大寺</a>大仏開眼会の前後に、唐との交流を通じて渡来したものと推測されている<sup>[3]</sup>。当時、大寺院では経典をネズミの食害から守る目的で猫が重宝されたと考えられており、𣑥の渡来もそうした実用的背景と結び付けて説明されることがある。ただし、宮中に入った後の𣑥は、実用動物というより愛玩動物として扱われたとする伝承が中心である。'],
              ['『<a href="/main.html?query=続日本紀">続日本紀</a>』などの史料には、天皇が唐猫を「愛玩甚だ厚し」と記されているが、具体的な固有名詞は確認されていない<sup>[4]</sup>。', '正史にはこの猫の固有名を確認できず、後世の説話や研究上の復元では、聖武天皇が唐猫を厚く愛玩したとする伝承が紹介されている<sup>[4]</sup>。'],
              ['𣑥の存在は、猫が日本において実用動物から愛玩動物へと昇華する転換点を示すものとして重要視される', '𣑥の伝承は、猫が日本において実用動物から愛玩動物へと位置づけを広げていく過程を象徴するものとして扱われる']
            ], 'Clarify Kuchiki cat article claims');

            await fixFile('5/index.html', [
              ['<tr><th>作動方式</th><td>ガス圧作動式（ディレイドブローバック）</td></tr>', '<tr><th>作動方式</th><td>手動後装式（単発）</td></tr>'],
              ['通常の小銃の<b>数十倍</b>に及ぶ強烈な反動エネルギー', '通常の小銃を大幅に上回る強烈な反動エネルギー'],
              ['情報を**ローカルに保存**しています。', '情報を<strong>ローカルに保存</strong>しています。']
            ], 'Fix KAR-21 mechanism and markup consistency');

            await fixFile('6/index.html', [
              ['<tr><th>駅数</th><td>30駅（未供用駅を除く）</td></tr>', '<tr><th>駅数</th><td>30駅</td></tr>'],
              ['1985年（昭和60年）、高度経済成長期における都心部への人口集中と、それに伴う住宅不足を解消するために計画された', '1985年（昭和60年）、首都圏の郊外化と住宅需要の拡大に対応するために計画された'],
              ['その後、バブル経済期の観光ブームを受け、西部の温泉地および湖畔リゾートへのアクセス改善が急務となり、1990年代初頭に', 'その後、1980年代末から1990年代初頭にかけてのリゾート開発ブームを受け、西部の温泉地および湖畔リゾートへのアクセス改善が進められ、1990年代初頭に'],
              ['<b>東部エリア（SML01 - SML20）限定</b>', '<b>東部系統（SML01 - SML20）限定</b>'],
              ['海水浴場・マリーナ', '湖水浴場・マリーナ'],
              ['夜間の無人駅への用もない立ち入りは危険である', '夜間の無人駅への不要不急の立ち入りは危険である'],
              ['**咲仲**', '<b>咲仲</b>'],
              ['**笹原駅（SML27）**', '<b>笹原駅（SML27）</b>'],
              ['**「篷聾（ほうろう）へ行くか？」**', '<b>「篷聾（ほうろう）へ行くか？」</b>']
            ], 'Fix SanMaru Line timeline and markup');

            await fixFile('7/index.html', [
              ['<tr><th scope="row">別名</th><td>中枢性警告徴候 (Central Warning Sign, CWS)<br>二次性神経疲労症候群</td></tr>', '<tr><th scope="row">別名</th><td>二次性神経疲労症候群</td></tr>'],
              ['一連の<a href="/main.html?query=身体表現性障害">身体表現性障害</a>の総称である。', '架空の<a href="/main.html?query=機能性身体症候群">機能性身体症候群</a>の一種である。'],
              ['現代医学においては、<a href="/main.html?query=機能性身体症候群">機能性身体症候群</a>（FSS）の一種として分類されることが多いが', '作中の医学設定では、<a href="/main.html?query=機能性身体症候群">機能性身体症候群</a>（FSS）の一種として分類されるが'],
              ['先進国における有病率は人口の約0.5%〜1.2%と推計されている。', '作中設定では、先進国における有病率は人口の約0.5%〜1.2%と推計されている。'],
              ['特効薬は存在せず、生活習慣への介入', '作中設定上、特効薬は存在せず、生活習慣への介入']
            ], 'Clarify fictional medical article wording');

            await fixFile('8/index.html', [
              ['そして唐国内の動乱により、その効力を持つ期間は短かったとされる。', 'そして唐国内の動乱により、正式な多国間条約として発効した形跡はなく、試行的な運用も短期間で形骸化したとされる。'],
              ['各国が抱える現実的な問題や外交実態を無視した内容であったため、発効後すぐに機能不全に陥った。', '各国が抱える現実的な問題や外交実態を十分に反映しておらず、各国の正式な合意には至らないまま、試行的な運用段階から機能不全に陥った。'],
              ['寧道書には、五カ国間の使節の儀礼規定、通交ルート、朝貢頻度、そして国境の平和維持に関する詳細な条項が記されていた。', '現存する断片史料からは、五カ国間の使節儀礼、通交ルート、朝貢頻度、国境の平和維持などに関する条項が構想されていたと推定される。']
            ], 'Fix Ningdao draft status wording');

            await fixFile('9/index.html', [
              ['<tr><th>解体理由</th><td>主犯・神崎周一郎の死刑確定と団員の一斉検挙</td></tr>', '<tr><th>解体理由</th><td>神崎周一郎の逮捕と団員の一斉検挙</td></tr>'],
              ['主犯の死刑判決と団員の一斉検挙により、自然解体に至った。', '神崎の逮捕と団員の一斉検挙により、事実上解体された。'],
              ['組織は指導者層を失ったことで自然と解体した。', '組織は指導者層を失い、捜査当局によって事実上解体された。'],
              ['戦前の日本の司法における大きな課題の一つとして残された', '当時の日本社会における大きな課題の一つとして残された'],
              ['醫療団', '医療団']
            ], 'Fix tuberculosis article chronology and orthography');

            await fixFile('list/index.html', [
              ['クッキーを取得しています。。', 'クッキーを使用しています。'],
              ['<h4>当社の他のサイト</h4>', '<h4>他の制作物</h4>'],
              ['>日本の戦闘歴史年表</a>', '>歴史上の国一覧</a>']
            ], 'Fix article list wording');
