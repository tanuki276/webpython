name: Apply text consistency fixes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-text-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '1/index.html';
            const r = await github.rest.repos.getContent({owner, repo, path});
            let text = Buffer.from(r.data.content, 'base64').toString('utf8');
            text = text.replace('<tr><th>建都年</th><td>1871年</td>', '<tr><th>市制施行</th><td>1871年</td>');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, message: 'Fix article chronology wording', content: Buffer.from(text).toString('base64'), sha: r.data.sha});
# trigger
