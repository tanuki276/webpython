name: Apply Wikipedia-like Vector UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Wikipedia-like Vector UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add shared Vector-style CSS and enable it on all pages
        shell: bash
        run: |
          cat > wiki-vector.css <<'CSS'
          :root {
            --vector-text: #202122;
            --vector-muted: #54595d;
            --vector-link: #3366cc;
            --vector-link-visited: #795cb2;
            --vector-border: #a2a9b1;
            --vector-border-subtle: #eaecf0;
            --vector-surface: #ffffff;
            --vector-surface-subtle: #f8f9fa;
            --vector-surface-hover: #f1f2f3;
          }

          * { box-sizing: border-box; }
          html { background: var(--vector-surface); }
          body {
            margin: 0 !important;
            padding: 0 !important;
            display: block !important;
            background: var(--vector-surface) !important;
            color: var(--vector-text) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif !important;
            font-size: 14px !important;
            line-height: 1.65 !important;
          }

          body::before {
            content: "Liefantidia";
            display: block;
            min-height: 52px;
            padding: 10px 24px 9px;
            border-bottom: 1px solid var(--vector-border-subtle);
            background: #fff;
            color: #101418;
            font-family: Georgia, "Times New Roman", "Yu Mincho", serif;
            font-size: 23px;
            line-height: 32px;
            letter-spacing: .01em;
          }

          .container {
            display: block !important;
            width: 100% !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #fff !important;
            border: 0 !important;
            box-shadow: none !important;
          }

          .main-content {
            position: relative;
            width: calc(100% - 48px) !important;
            max-width: 960px !important;
            min-height: 0 !important;
            margin: 0 auto !important;
            padding: 30px 0 64px !important;
            background: #fff !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
          }

          #site-logo {
            max-width: 155px !important;
            height: auto !important;
            margin: 4px 0 16px !important;
          }

          h1, h2 {
            color: var(--vector-text) !important;
            font-family: Georgia, "Times New Roman", "Yu Mincho", serif !important;
            font-weight: 400 !important;
            text-align: left !important;
          }

          h1 {
            margin: 0 0 .55em !important;
            padding: 0 0 .18em !important;
            border-bottom: 1px solid var(--vector-border) !important;
            font-size: 2.05rem !important;
            line-height: 1.25 !important;
          }

          h2 {
            margin: 1.7em 0 .65em !important;
            padding: 0 0 .18em !important;
            border-bottom: 1px solid var(--vector-border) !important;
            font-size: 1.55rem !important;
            line-height: 1.3 !important;
          }

          h3, h4 {
            color: var(--vector-text) !important;
            font-weight: 600 !important;
          }
          h3 { margin: 1.35em 0 .45em !important; font-size: 1.18rem !important; }
          h4 { margin: 1.15em 0 .4em !important; font-size: 1rem !important; }

          p { margin: .5em 0 1em; }
          ul, ol { padding-left: 2.1em; }
          li { margin: .18em 0; }

          a { color: var(--vector-link) !important; text-decoration: none !important; }
          a:visited { color: var(--vector-link-visited); }
          a:hover, a:focus { text-decoration: underline !important; }

          .intro-explanation,
          .warning-box,
          .urban-legend,
          .search-container {
            margin: 1em 0 1.5em !important;
            padding: 12px 14px !important;
            border: 1px solid var(--vector-border-subtle) !important;
            border-left: 4px solid var(--vector-border) !important;
            border-radius: 0 !important;
            background: var(--vector-surface-subtle) !important;
            color: var(--vector-text) !important;
            box-shadow: none !important;
          }

          .article-card {
            display: block;
            margin: 0 0 12px !important;
            padding: 12px 14px !important;
            border: 1px solid var(--vector-border-subtle) !important;
            border-left: 3px solid var(--vector-link) !important;
            border-radius: 0 !important;
            background: #fff !important;
            color: inherit !important;
            box-shadow: none !important;
            transform: none !important;
          }
          .article-card:hover { background: var(--vector-surface-subtle) !important; transform: none !important; }
          .article-card h3 { margin-top: 0 !important; color: var(--vector-link) !important; }

          .list-link-container { margin: 24px 0 !important; text-align: left !important; }
          .big-link-button {
            display: inline-block !important;
            width: auto !important;
            padding: 5px 0 !important;
            border: 0 !important;
            border-bottom: 1px solid var(--vector-link) !important;
            background: transparent !important;
            color: var(--vector-link) !important;
            font-size: 1rem !important;
            transform: none !important;
          }
          .big-link-button::after { content: " →" !important; }

          .infobox {
            float: right !important;
            width: 300px !important;
            margin: .25em 0 1em 1.5em !important;
            border: 1px solid var(--vector-border) !important;
            border-collapse: collapse !important;
            border-radius: 0 !important;
            background: var(--vector-surface-subtle) !important;
            box-shadow: none !important;
            font-size: .9em !important;
          }
          .infobox caption {
            padding: 7px 8px !important;
            border: 1px solid var(--vector-border) !important;
            border-bottom: 0 !important;
            background: #eaecf0 !important;
            color: var(--vector-text) !important;
            font-weight: 700 !important;
            text-align: center !important;
          }
          .infobox th, .infobox td {
            padding: 5px 8px !important;
            border: 1px solid var(--vector-border-subtle) !important;
            vertical-align: top !important;
          }
          .infobox th { background: #eaecf0 !important; font-weight: 600 !important; }

          #toc {
            width: fit-content !important;
            max-width: 100% !important;
            margin: 1em 0 1.5em !important;
            padding: 10px 14px !important;
            border: 1px solid var(--vector-border) !important;
            border-radius: 0 !important;
            background: var(--vector-surface-subtle) !important;
            color: var(--vector-text) !important;
            font-size: .9em !important;
          }
          #toc h2 {
            margin: 0 0 5px !important;
            padding: 0 !important;
            border: 0 !important;
            font-family: inherit !important;
            font-size: 1em !important;
            font-weight: 700 !important;
          }
          #toc ul { margin: 0 !important; padding-left: 1.4em !important; }

          .wikitable,
          .climate-table,
          table:not(.infobox) {
            max-width: 100%;
            border-collapse: collapse !important;
            background: #fff;
          }
          .wikitable th, .wikitable td,
          .climate-table th, .climate-table td {
            padding: 6px 8px !important;
            border: 1px solid var(--vector-border) !important;
          }
          .wikitable th, .climate-table th { background: #eaecf0 !important; font-weight: 600 !important; }

          hr { border: 0; border-top: 1px solid var(--vector-border-subtle); }
          img { max-width: 100%; height: auto; }

          .footer-base {
            margin-top: 48px !important;
            padding-top: 14px !important;
            border-top: 1px solid var(--vector-border-subtle) !important;
            color: var(--vector-muted) !important;
            font-size: .82rem !important;
          }

          #backToTop {
            right: 18px !important;
            bottom: 18px !important;
            width: 40px !important;
            height: 40px !important;
            padding: 0 !important;
            border: 1px solid #72777d !important;
            border-radius: 2px !important;
            background: #fff !important;
            color: var(--vector-text) !important;
            box-shadow: 0 1px 3px rgba(0,0,0,.12) !important;
            font-size: 18px !important;
          }

          #genericCookieNotice {
            left: 50% !important;
            bottom: 16px !important;
            width: min(92%, 680px) !important;
            padding: 12px 16px !important;
            transform: translateX(-50%) !important;
            border: 1px solid #72777d !important;
            border-radius: 2px !important;
            background: #fff !important;
            color: var(--vector-text) !important;
            box-shadow: 0 2px 10px rgba(0,0,0,.18) !important;
          }
          #genericCookieNotice button {
            margin-left: 10px !important;
            padding: 6px 12px !important;
            border: 1px solid #36c !important;
            border-radius: 2px !important;
            background: #36c !important;
            color: #fff !important;
          }

          @media (min-width: 1320px) {
            .main-content { max-width: 960px !important; }
            #toc {
              position: sticky !important;
              top: 16px !important;
              float: left !important;
              width: 190px !important;
              max-height: calc(100vh - 32px) !important;
              margin-left: -220px !important;
              margin-right: 18px !important;
              padding: 0 10px 0 0 !important;
              overflow: auto !important;
              border: 0 !important;
              background: #fff !important;
            }
          }

          @media (max-width: 760px) {
            body { font-size: 15px !important; }
            body::before { min-height: 46px; padding: 8px 14px 7px; font-size: 20px; line-height: 30px; }
            .main-content {
              width: calc(100% - 24px) !important;
              padding: 20px 0 48px !important;
            }
            h1 { font-size: 1.75rem !important; }
            h2 { font-size: 1.35rem !important; }
            .infobox {
              float: none !important;
              width: 100% !important;
              margin: 1em 0 !important;
            }
            #toc {
              float: none !important;
              position: static !important;
              width: 100% !important;
              margin: 1em 0 1.5em !important;
            }
            .wikitable, .climate-table { display: block !important; overflow-x: auto !important; }
            .footer-base { display: block !important; }
            #site-logo { max-width: 130px !important; }
          }
          CSS

          python3 - <<'PY'
          from pathlib import Path
          marker = '    <link rel="stylesheet" href="/wiki-vector.css">\n'
          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text or '/wiki-vector.css' in text:
                  continue
              text = text.replace('</head>', marker + '</head>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('Updated:', ', '.join(changed))
          PY

          rm .github/workflows/apply-vector-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use Wikipedia-like Vector styling"
          git push origin HEAD:main
